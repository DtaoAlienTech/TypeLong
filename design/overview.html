<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>TypeClash - all screens</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0B0D1A; --border:#2C3366; --text:#E8EBFF; --dim:#8089C0; --you:#22E4FF; --rival:#FF3D8B; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px; background: var(--bg); color: var(--text); font-family: "Space Grotesk", system-ui, sans-serif; width: 1800px; }
  h1 { margin: 0 0 4px; font-size: 44px; letter-spacing: .04em; }
  h1 span { background: linear-gradient(90deg, var(--you), #7C5CFF 55%, var(--rival)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--dim); margin: 0 0 8px; font-size: 16px; }
  h2 { margin: 40px 0 14px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; align-items: start; }
  .mgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 22px; align-items: start; }
  figure { margin: 0; }
  figure img { display: block; width: 100%; border-radius: 12px; border: 1px solid var(--border); }
  figcaption { margin-top: 8px; font-size: 14px; color: var(--dim); }
  figcaption b { color: var(--text); font-weight: 700; margin-right: 6px; }
</style></head><body>
